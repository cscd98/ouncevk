# SPDX-License-Identifier: MIT
#
# Pushing a version tag publishes OunceVK's pacman package as that tag's
# GitHub release. The tag is the version (20261117, or 20261117.1 for another
# release on the same day); an annotated tag's message becomes the release
# notes:
#   git tag -a 20261118 && git push origin 20261118
# Running the workflow by hand builds the package without publishing it.
name: Release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version of the test package
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # actions/checkout does not keep an annotated tag's message.
      - name: Fetch the tag
        if: github.event_name == 'push'
        run: git fetch --depth=1 --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Build and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: CONTAINER=docker sh packaging/release.sh "$GITHUB_REF_NAME"

      - name: Build
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: CONTAINER=docker NO_UPLOAD=1 sh packaging/release.sh "$VERSION"

      - name: Keep the test package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ouncevk-${{ inputs.version }}
          path: packaging/release/
